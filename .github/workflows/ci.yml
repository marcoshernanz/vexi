name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node (sdk + example-app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            example-app/package-lock.json

      - name: Install SDK deps
        working-directory: sdk
        run: npm ci

      - name: Lint SDK
        working-directory: sdk
        run: npm run lint

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Install example-app deps
        working-directory: example-app
        run: npm ci

      - name: Typecheck example-app
        working-directory: example-app
        run: npx tsc --noEmit

  rust:
    name: Rust (api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        working-directory: api
        run: cargo fmt --check

      - name: Clippy
        working-directory: api
        run: cargo clippy -- -D warnings

      - name: Tests
        working-directory: api
        run: cargo test
